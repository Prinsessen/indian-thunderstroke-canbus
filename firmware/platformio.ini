; PlatformIO project — Indian Springfield 2017 CAN bus interface
;
; Always name the environment; there is no default, and a bare `pio run` builds
; every one of them, starting with the retired test rig.
;
;   sniffer-t2can         the bike: CANFD-MC (own board) or LilyGO T-2CANFD,
;                         ESP32-S3 + MCP2518FD on SPI. Identity canbus/springfield.
;   bench-canfdmc         the same board on the bench, own identity canbus/bench
;   bench-rollback, -bad  bench-only test images for the OTA rollback (OTA.md)
;   sniffer-t2can-nomqtt  build check only: the network half compiled out
;   sniffer, sniffer-usb  the first test rig, LilyGO T-CAN485: classic ESP32
;                         with a built-in transceiver on the native TWAI
;                         controller (no SPI, no crystal setting). Retired.
;
; Build, flash over USB and open the serial monitor:
;    pio run -e sniffer-t2can -t upload -t monitor

[env:sniffer]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = time, colorize
; OTA upload settings (WiFi firmware update)
upload_protocol = espota
upload_timeout = 120
upload_retry_count = 5
; CAN uses the ESP32 native TWAI driver bundled with arduino-esp32 — no CAN lib.
lib_deps =
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.0.4
    fastled/FastLED@^3.7.0
    h2zero/NimBLE-Arduino@^2.2.3

; -----------------------------------------------------------------------------
; USB cable flashing variant — same firmware, but uploads over the serial cable
; instead of espota/WiFi. Use this when the board is on your bench:
;     pio run -e sniffer-usb -t upload            (auto-detects the USB port)
;     pio run -e sniffer-usb -t upload -t monitor (flash + open serial monitor)
; Add  --upload-port /dev/cu.usbserial-XXXX  if auto-detect picks the wrong one.
; -----------------------------------------------------------------------------
[env:sniffer-usb]
extends = env:sniffer
upload_protocol = esptool

; -----------------------------------------------------------------------------
; BOARD — LilyGO T-2CANFD (ESP32-S3-WROOM-1U + external MCP2518FD on SPI, "CAN A").
; Same source, different CAN HAL backend (can_hal_mcp.cpp). To use it:
;   1. In src/config.h set:  #define CAN_BACKEND CAN_BACKEND_MCP2518
;                       and:  #define STATUS_LED 0   (no WS2812 LED on this board)
;   2. Build over USB:  pio run -e sniffer-t2can -t upload -t monitor
;   3. MCP oscillator = 40 MHz (already set in can_hal_mcp.cpp) — matches the
;      T-2CANFD crystal. A wrong value = ZERO frames.
; NOTE: NO FastLED here — the T-2CANFD has no addressable LED, and with
; STATUS_LED 0 the FastLED include in main.cpp is compiled out, so the library
; must NOT be listed (otherwise it just bloats the build). ACAN2517FD is the only
; extra dep vs the T-CAN485 env above.
; NimBLE IS listed in both envs, unlike FastLED: BLE is on-chip on the ESP32 and
; the ESP32-S3 alike, so it is not board-specific hardware. With ENABLE_BLE 0 the
; library is never #included and PlatformIO's dependency finder skips building it.
; (ESP32-S3 has BLE only — no Bluetooth Classic/SPP — which is why the phone link
; is GATT rather than a serial profile.)
; -----------------------------------------------------------------------------
[env:sniffer-t2can]
platform = espressif32
board = esp32-s3-devkitc-1         ; ESP32-S3-WROOM-1U (16MB flash / 8MB PSRAM)
framework = arduino
monitor_speed = 115200
monitor_filters = time, colorize
upload_protocol = esptool          ; flash over USB
build_flags =
    -D ARDUINO_USB_CDC_ON_BOOT=1   ; route Serial to native USB-CDC on the S3
lib_deps =
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.0.4
    pierremolinaro/ACAN2517FD@^2.1.9
    h2zero/NimBLE-Arduino@^2.2.3

; -----------------------------------------------------------------------------
; BOARD - CANFD-MC (own PCB, same pin map as the T-2CANFD) on the BENCH, next to
; the one on the bike. Identical firmware, different identity (env bench-canfdmc
; below): MQTT under canbus/bench instead of canbus/springfield, BLE name
; CANFD-bench, client id canfd-bench-<mac>, its own OTA image file. openHAB
; follows it through its own thing and items (CanBench_*), so a bench board can
; come and go without touching the bike's items. A CANFD-MC that goes ON the
; bike is flashed with sniffer-t2can, not this (FLASHING.md 5b).
; -----------------------------------------------------------------------------
; The same board with the network half compiled out (ENABLE_MQTT 0, and with it
; ENABLE_WIFI). Built on every change and never flashed here: it exists so the
; flag stays a real boundary -- on 2026-09-27 it had rotted to 13 errors
; because only one variant was ever built.
[env:sniffer-t2can-nomqtt]
extends = env:sniffer-t2can
build_flags =
    ${env:sniffer-t2can.build_flags}
    -D NO_MQTT_BUILD=1

[env:bench-canfdmc]
extends = env:sniffer-t2can
build_flags =
    ${env:sniffer-t2can.build_flags}
    -D BENCH_BOARD=1

; -----------------------------------------------------------------------------
; ROLLBACK TEST (branch rollback-bench, bench board only). Same bench identity;
; FW_VERSION set here so the images cannot be mistaken for anything the bike
; runs, and so two builds of the same code differ in version (an OTA to the
; same version is skipped as "no update"). bench-rollback-bad reaches the
; broker and ignores it on purpose, so the roll-back path can be watched over
; MQTT; its grace is two minutes instead of five. Never flash -bad on the bike.
; -----------------------------------------------------------------------------
[env:bench-rollback]
extends = env:bench-canfdmc
build_flags =
    ${env:bench-canfdmc.build_flags}
    -D FW_VERSION=\"2026.10.04-rb1\"

[env:bench-rollback-bad]
extends = env:bench-canfdmc
build_flags =
    ${env:bench-canfdmc.build_flags}
    -D FW_VERSION=\"2026.10.04-rb9-bad\"
    -D ROLLBACK_TEST_NO_BROKER=1
    -D ROLLBACK_GRACE_MS=120000
